name: Build Winroc Metrics

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/debug-info

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: winroc-metrics-android
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  windows:
    name: Windows EXE + Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\winroc_setup.iss'
        shell: pwsh

      - name: Create portable ZIP
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "build\WinrocMetrics-Portable.zip" -Force
        shell: pwsh

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: winroc-metrics-windows-installer
          path: build/installer/*.exe
          if-no-files-found: error

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: winroc-metrics-windows-portable
          path: build/WinrocMetrics-Portable.zip
          if-no-files-found: error