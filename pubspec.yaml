name: winroc_metrics
description: "Attendance and dues management for the Winneba Secondary School Robotics Club (WINNESEC). Offline-first, encrypted, GHS."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.20.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  pointycastle: ^3.9.1
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  path_provider: ^2.1.3
  path: ^1.9.0
  uuid: ^4.4.0
  intl: ^0.19.0
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0
  pdf: ^3.11.0
  printing: ^5.13.0
  csv: ^6.0.0
  excel: ^4.0.6
  file_picker: ^11.0.0
  share_plus: ^10.0.2
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  local_auth_windows: ^1.0.11
  fl_chart: ^0.69.0
  package_info_plus: ^8.0.2
  flutter_local_notifications: ^19.5.0
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.20.0
  sqlite3: ^3.4.0

# Bundle a prebuilt SQLCipher (encrypted SQLite) via sqlite3's native hook.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
  assets:
    - assets/branding/